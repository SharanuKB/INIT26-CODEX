<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapitalGuard - Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="login-body">

    <div class="login-container">

        <div class="login-logo">
            <div class="logo-icon">CG</div>
            <h1>CapitalGuard</h1>
            <p>Asset & Capital Optimization Platform</p>
        </div>

        <div class="login-card">

            <h2>Welcome Back</h2>
            <p class="login-subtitle">Sign in to your risk management dashboard</p>

            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username">

            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">

            <button class="primary-btn" onclick="login()">Login</button>

            <p id="loginMessage" class="login-message"></p>

        </div>

        <p class="login-footer">Secure Financial Management System</p>

    </div>

    <script src="../js/app.js"></script>

</body>
</html>
